set -g prefix ^A
set -g base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g detach-on-destroy off
set -g focus-events on
set-option -g status-position top
set -g status-interval 10
bind-key '"' split-window -c '#{pane_current_path}'
bind-key % split-window -h -c '#{pane_current_path}'
bind-key a set-window-option synchronize-panes\; display-message 'synchronize-panes is now #{?pane_synchronized,on,off}'

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key C-h resize-pane -L 5
bind-key C-j resize-pane -D 5
bind-key C-k resize-pane -U 5
bind-key C-l resize-pane -R 5

bind-key -n F2 new-window 
bind-key -n F5 split-window -h -c "#{pane_current_path}"
bind-key -n F6 split-window -v -c "#{pane_current_path}"
bind-key -n F8 command-prompt -I "#W" "rename-window '%%'"
bind-key -n F7 command-prompt "find-window '%%'"
bind-key -n F10 setw synchronize-panes
bind-key -n F11 resize-pane -Z
bind-key -n F12 kill-pane
bind-key -n C-PageDown next-window
bind-key -n C-PageUp previous-window
bind-key -n M-S-Left resize-pane -L
bind-key -n M-S-Right resize-pane -R
bind-key -n M-S-Up resize-pane -U
bind-key -n M-S-Down resize-pane -D
bind -n M-\; copy-mode
bind-key w select-window -t 1
bind -n M-s switch-client -l

bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# ==========================================
#  TEMA: Carbonfox (Preto Puro para X61s)
# ==========================================

# Suporte a cores True Color no terminal
set -g default-terminal "screen-256color"
set -as terminal-features ",foot*:RGB,alacritty*:RGB,xterm-256color:RGB"

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'

# --- Estilos Globais da Barra de Status ---
# Fundo zerado em #000000 para tirar o tom cinza
set -g status-style "bg=#000000,fg=#7b8496"
set -g status-left-length 100
set -g status-right-length 100

# Bordas dos painéis
set -g pane-border-style "fg=#1c1d21"
set -g pane-active-border-style "fg=#78a9ff"

# Mensagens do sistema
set -g message-style "bg=#1c1d21,fg=#33b1ff"

# --- Formatação das Janelas (Lógica mantida) ---
# Janela inativa
set -g window-status-format "#[fg=#000000,bg=#252525,bold] #I #[fg=#7b8496,bg=#000000] #{?#{==:#T,#h},#{?#{==:#W,zsh},#{b:pane_current_path},#W},#T} "

# Janela ativa (destaque em ciano do Carbonfox)
set -g window-status-current-format "#[fg=#000000,bg=#33b1ff,bold] #I #[fg=#ffffff,bg=#1c1d21,bold] #{?#{==:#T,#h},#{?#{==:#W,zsh},#{b:pane_current_path},#W},#T} "

# --- Lado Esquerdo e Direito ---
set -g status-left ""

# Módulos do Lado Direito: Aplicação, CPU, Sessão e Uptime Detalhado
set -g status-right "#[fg=#78a9ff,bg=#000000]󰅍 #{pane_current_command} "
set -ag status-right "#[fg=#be93f7,bg=#000000] |  #{cpu_percentage} "
set -ag status-right "#[fg=#25be7b,bg=#000000] | 󰆍 #S "
set -ag status-right "#[fg=#f29680,bg=#000000] | 󰅐 #(uptime | sed -E 's/.*up ([0-9]+ days?, )?([0-9]+:[0-9]+|[0-9]+ min).*/\\1\\2/' | sed 's/ days, /d /; s/ day, /d /; s/ mins/m/; s/ min/m/') "

set -g @plugin 'tmux-plugins/tmux-cpu'

set -g @plugin 'tmux-plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'
